[project]
name = "systemsight"
version = "3.0.0"
description = "Cross-platform observability, alerting, forecasting, SLO, fleet and incident analysis toolkit"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]
authors = [{name = "Shivam Patel"}]
license = {text = "MIT"}
keywords = ["monitoring", "observability", "prometheus", "psutil", "alerting", "slo", "capacity-planning"]

[project.scripts]
systemsight = "systemsight.cli:main"
systemsight-server = "systemsight.server:main"
systemsight-demo = "systemsight.demo:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
